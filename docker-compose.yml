services:
  # Service 1: Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: Rafi330646859
      POSTGRES_DB: socialnetwork
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d socialnetwork"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
